name: Tests

# The plugin claims two platforms in the catalog entry, so both are tested, plus Windows: the
# catalog reviewer asked whether the pinned code runs outside Linux, and a green run on a real
# NTFS/FAT filesystem is the only answer that is not a guess. Actions minutes are free for public
# repositories, so the matrix costs nothing but the wall time.
#
# Action pins are the same commit SHAs the hermes-agent repository itself runs on its own runners —
# deliberately not a brand-new major version whose behaviour cannot be verified from here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing must not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the test dependencies
        # Pillow is a core hermes-agent dependency, so the plugin never declares it. The suite
        # needs it explicitly, at the version the plugin documents as tested.
        run: python -m pip install --disable-pip-version-check "pillow==12.3.0" "pyyaml==6.0.2" pytest

      - name: Report the Pillow build under test
        run: python -c "from PIL import Image, features; Image.init(); print('Pillow', Image.__version__); print('AVIF save:', 'AVIF' in Image.SAVE); print('libjpeg-turbo:', features.check_feature('libjpeg_turbo') if hasattr(features, 'check_feature') else 'n/a')"

      - name: Run the suite
        run: python -m pytest tests -q
